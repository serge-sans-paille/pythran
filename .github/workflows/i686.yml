name: i386
permissions:
   contents: read  # to fetch code (actions/checkout)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    # borrowed from scipy's .github/workflows/linux.yml
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build + test
      run: |
        set -exuo pipefail
        docker pull quay.io/pypa/manylinux_2_28_i686
        docker run  --privileged -v $(pwd):/pythran quay.io/pypa/manylinux_2_28_i686 /bin/bash -c "\
             set -exuo pipefail \
          && cd /pythran \
          && python3.12 -m venv test \
          && source test/bin/activate \
          && python -m pip install --upgrade pip \
          && python -m pip install . \
          && python -m pip install . 'pythran[build]' \
          && python -m pip install . 'pythran[test]' \
          && python -m pip install pytest-xdist \
          && printf '[compiler]\nblas=none\n' > ~/.pythranrc \
          && pytest pythran/tests/test_*.py -v -x --numprocesses=auto \
       "
