name: limited api

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15.0-rc.2"]
        api-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v6
    - name: Install native dependencies
      run: |
        sudo apt install ${{ matrix.cpp-version }}
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install pytest-xdist
    - name: Setup
      run: |
        python -m pip install .
    - name: Testing limited api
      run: |
        printf '[compiler]\nblas=none\n' > ~/.config/.pythranrc
        printf "[backend]\nlimited_api=${{ matrix.api-version }}\nfreethreading_compatible=false" >> ~/.config/.pythranrc
        pytest pythran/tests/test_base.py -v -x
